<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Reweave</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ============ 화면 1. 로그인 ============ -->
  <section id="screen-login" class="screen active">
    <button class="icon-btn close-btn" data-close>
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6L18 18M18 6L6 18" stroke="#FBFDFB" stroke-width="2"/></svg>
    </button>

    <div class="login-logo">
      <img src="images/title.svg" width="187.71" height="47.2" alt="Reweave" />
    </div>

    <div class="login-fields">
      <input type="email" class="field field-top" placeholder="이메일" />
      <input type="password" class="field field-bottom" placeholder="비밀번호" />
    </div>

    <button class="btn-primary" id="btn-login">로그인하기</button>
    <button class="link-underline" id="btn-goto-signup">회원가입</button>
  </section>

  <!-- ============ 화면 2. 링크 저장 ============ -->
  <section id="screen-save" class="screen">
    <header class="screen-header">
      <h1 class="screen-title">링크 저장</h1>
      <button class="icon-btn close-btn" data-close>
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6L18 18M18 6L6 18" stroke="#FBFDFB" stroke-width="2"/></svg>
      </button>
    </header>

    <div class="field-group">
      <div class="url-box" id="current-url">https://example.com/...</div>
    </div>

    <div class="field-group">
      <div class="row-between">
        <span class="label">카테고리</span>
        <button class="icon-btn" id="btn-add-category">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#7CE924" stroke-width="2"/></svg>
        </button>
      </div>
      <div class="chip-row" id="category-chips">
        <button class="chip" data-category="미분류">미분류</button>
        <button class="chip" data-category="취업">취업</button>
        <button class="chip chip-selected" data-category="디자인">디자인</button>
        <button class="chip" data-category="여행">여행</button>
        <button class="chip" data-category="쇼핑">쇼핑</button>
        <button class="chip" data-category="맛집">맛집</button>
      </div>
    </div>

    <div class="field-group">
      <span class="label">메모</span>
      <textarea class="textarea" id="memo-input" placeholder="간단한 메모를 입력해주세요"></textarea>
    </div>

    <div class="bottom-group">
      <button class="btn-primary" id="btn-save">저장하기</button>
      <span class="hint-text">enter</span>
    </div>
  </section>

  <!-- ============ 화면 3. 카테고리 생성 ============ -->
  <section id="screen-category" class="screen">
    <header class="screen-header">
      <div class="header-left">
        <button class="icon-btn" id="btn-back-to-save">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7" stroke="#FBFDFB" stroke-width="2" fill="none"/></svg>
        </button>
        <h1 class="screen-title">카테고리 생성</h1>
      </div>
      <button class="icon-btn close-btn" data-close>
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6L18 18M18 6L6 18" stroke="#FBFDFB" stroke-width="2"/></svg>
      </button>
    </header>

    <div class="field-group gap-30">
      <span class="label label-18">카테고리 제목</span>
      <input type="text" class="field field-standalone" id="category-title" placeholder="카테고리 제목추가" />
    </div>

    <div class="field-group gap-30">
      <span class="label label-18">카테고리 설명</span>
      <textarea class="field field-standalone" id="category-desc" placeholder="카테고리 설명추가"></textarea>
    </div>

    <div class="bottom-group">
      <button class="btn-primary" id="btn-create-category">카테고리 만들기</button>
      <span class="hint-text">enter</span>
    </div>
  </section>

  <!-- ============ 화면 4. 저장완료 ============ -->
  <section id="screen-complete" class="screen">
    <button class="icon-btn close-btn" data-close>
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6L18 18M18 6L6 18" stroke="#FBFDFB" stroke-width="2"/></svg>
    </button>

    <div class="complete-icon">
      <img src="images/bookmark-check.png" alt="" />
    </div>

    <h2 class="complete-title">저장완료!</h2>
    <p class="complete-sub">3초 후에 자동으로 팝업이 종료됩니다</p>

    <div class="bottom-group">
      <!-- 로그인 여부에 따라 버튼 텍스트 분기 (디자인 확인 필요) -->
      <button class="btn-primary" id="btn-complete-action">보러가기</button>
      <span class="hint-text">enter</span>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
